name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'

jobs:
  phpstan:
    name: phpstan - Lunar ${{ matrix.lunar }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lunar: ['1.3.*', '^1.0']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        run: |
          composer require "lunarphp/core:${{ matrix.lunar }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction -W

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
